{
    "home-directory": {
        "path": "."
    },
    "flags": {
        "text-console": {
            "timestamp": "local",
            "signature": true,
            "method": false,
            "eol": true,
            "highlight": true
        },
        "text-minimal": {
            "timestamp": "local",
            "signature": true,
            "method": false,
            "eol": true,
            "highlight": true,
            "subsystem": true
        }
    },
    "channels": [
        {
            "name": "",
            "flags": "text-console",
            "level": "info",
            "backends": [
                {
                    "type": "ConsoleBackend"
                }
            ]
        },
        {
            "name": "file",
            "flags": "text-minimal",
            "level": "info",
            "backends": [
                {
                    "type": "FileBackend",
                    "file": "intermediate/galimatron.log",
                    "append": false
                }
            ]
        }
    ],
    "subsystems": {
        "allowed": [
            "EXEC",// executable
            "EXLIB",// executable library
            "RT",// runtime
            "RT-FS",// filesystem
            "RT-FSD",// filesystem decorator
            "RT-CFG",// config
            "RT-TRN",// translate
            "RT-SUM",// summary
            "TR",// translator
            "TR-PAR",// parser
            "TR-BLD",// builder
            "TR-CMP",// compiler
            "TR-G2S",// GaL to state
            "TR-HLD",// holder
            "TR-S2G",// state to GaL
            "TR-S2S",// state to state
            "TR-S2X",// state to XML
            "TR-X2S",// XML to state
            "TR-XSLT",// XSLT
            "TR-TSP",// transpiler
            "TR-WIZ"// wizard
        ]
    }
}
