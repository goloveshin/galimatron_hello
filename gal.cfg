// directory paths are absolute, or relative to this config (unless noted)
{
    "galimatron" : {
        "input-gal-dir" : "incoming_gal/",
        "output-gal-dir" : "incoming_gal/",
        "intermediate-xml-dir" : "intermediate/",
        "intermediate-log-dir" : "intermediate/",
        "intermediate-summary-dir" : "intermediate/"
    },
    "saxon-processor" : {
        "working-dir" : "xslt/",
        "config-file" : "config.xml" // relative to saxon-processor.working-dir
    },
    "transforms" : {
        "language-transforms" : {
            "buildin-transforms" : {
            },
            "user-transforms" : {
                "transforms" : [
                    {
                        "name" : "increment counter and write the greeting",
                        "input" : {
                            "principal-xsl" : {
                                "file" : "language.xsl", // relative to saxon-processor.working-dir
                                "parameters" : []
                            }
                        },
                        "output" : {
                            "principal-xml" : {
                            }
                        }
                    }
                ]
            }
        },
        "post-language-transforms" : {
            "user-transforms" : {
                "transforms" : [
                    {
                        "name" : "write hello.html",
                        "input" : {
                            "principal-xsl" : {
                                "file" : "page.xsl",
                                "parameters" : []
                            }
                        },
                        "output" : {
                            "principal-xml" : {
                            },
                            "other-files" : [
                                {
                                    "store-dir" : "page/",
                                    "store-dir-string-alias" : "page",
                                    "extentions" : [".html"],
                                    "replace-escaped-form-to-original-symbols" : false,
                                    "delete-if-not-rewrited" : true
                                }
                            ]
                        }
                    }
                ]
            }
        }
    }
}
